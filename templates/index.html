<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeatPulse v4.0 | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <style>
        #map { height: 600px; width: 100%; border-radius: 12px; }
        .leaflet-popup-content-wrapper { background: #111827; color: white; border: 1px solid #374151; }
        .leaflet-control-geocoder { background: #1f2937 !important; border: none; color: white; }
        .leaflet-control-geocoder-form input { color: white !important; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

    <header class="p-4 bg-gray-800 border-b border-gray-700 flex justify-between items-center shadow-xl">
        <h1 class="text-xl font-black text-orange-500 tracking-tighter">🔥 HEATPULSE <span class="text-xs text-gray-500">PROTOTYPE</span></h1>
        <div class="flex gap-3">
            <button onclick="locateMe()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-bold transition-all">📍 LIVE LOCATION</button>
            <a href="/api/export" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-bold border border-gray-600">📥 EXPORT CSV</a>
        </div>
    </header>

    <main class="p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">Diagnostic Terminal</h2>
                <div id="reportContainer" class="hidden space-y-4">
                    <div id="reportTerminal" class="bg-black p-4 rounded-lg border border-gray-700 font-mono text-[11px] leading-relaxed text-green-400 h-80 overflow-y-auto">
                        SYSTEM READY... AWAITING COORDINATES...
                    </div>
                </div>
                <div id="idleText" class="text-sm text-gray-500 italic text-center py-10">
                    Search a location or click the map to begin calculation.
                </div>
            </div>
        </div>

        <div class="lg:col-span-3">
            <div id="map" class="border border-gray-700 shadow-2xl"></div>
        </div>
    </main>

    <script>
        const map = L.map('map').setView([17.3850, 78.4867], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // Search Bar Logic
        const geocoder = L.Control.geocoder({
            defaultMarkGeocode: false,
            placeholder: "Search Name, Pincode, or Coordinates..."
        }).on('markgeocode', function(e) {
            const { center } = e.geocode;
            map.setView(center, 15);
            triggerAnalysis(center.lat, center.lng);
        }).addTo(map);

        // Map Click Logic
        map.on('click', (e) => triggerAnalysis(e.latlng.lat, e.latlng.lng));

        // Live Location Logic
        function locateMe() {
            navigator.geolocation.getCurrentPosition((pos) => {
                const { latitude, longitude } = pos.coords;
                map.setView([latitude, longitude], 15);
                triggerAnalysis(latitude, longitude);
            });
        }

        function triggerAnalysis(lat, lon) {
            fetch('/api/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ lat, lon })
            })
            .then(r => r.json())
            .then(data => {
                L.popup()
                    .setLatLng([lat, lon])
                    .setContent(`
                        <div class="p-2 text-center">
                            <div class="text-[10px] text-gray-400 uppercase">Thermal Score</div>
                            <div class="text-3xl font-bold ${data.color}">${data.score}</div>
                            <button onclick='renderReport(${JSON.stringify(data)})' class="mt-3 w-full bg-orange-600 py-2 rounded text-[10px] font-bold uppercase tracking-tighter">
                                📊 Generate Report
                            </button>
                        </div>
                    `)
                    .openOn(map);
            });
        }

        function renderReport(data) {
            document.getElementById('idleText').classList.add('hidden');
            document.getElementById('reportContainer').classList.remove('hidden');
            const term = document.getElementById('reportTerminal');
            
            term.innerHTML = `<span class="text-white">>> INITIALIZING CALCULATION...</span><br>COORD: ${data.lat}, ${data.lon}<br>---<br>`;
            
            setTimeout(() => {
                term.innerHTML += `
<span class="text-orange-500">MATHEMATICAL BREAKDOWN:</span>
- Surface Temp: ${data.temp}°C
- Rel. Humidity: ${data.humidity}%
- Vegetation Index: ${data.ndvi}
--------------------------
<span class="text-white">FORMULA: (T * (1-N)) + (H/20)</span>
FINAL TSI: <span class="text-xl font-bold">${data.score}</span>
--------------------------
<span class="font-bold underline uppercase">STATUS: ${data.status}</span>
<span class="text-gray-300 italic">${data.action}</span>
--------------------------
TIMESTAMP: ${new Date().toLocaleTimeString()}
                `;
            }, 500);
        }
    </script>
</body>
</html>
